<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learn - Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/css/home.css">
    <link rel="stylesheet" href="/public/css/auth.css"> </head>
<body class="auth-body">
    
    <div class="navbar" style="position: absolute; width: 100%; top: 0;"> 
        <img id="logo-img" src="/image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        <a href="../../index.html" style="margin-left: auto;" class="btn">Back to Home</a>
    </div>

    <div class="auth-wrapper">
        <div class="flip-container" id="flip-container">
            <div class="flipper">
                
                <div class="front">
                    <div class="form-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to continue your learning journey.</p>
                    </div>
                    
                    <form action="/api/login" method="POST" class="auth-form">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="auth-btn">Sign In</button>
                    </form>
                    
                    <div class="form-footer">
                        <p>Don't have an account? <span class="flip-link" onclick="toggleFlip()">Register here</span></p>
                    </div>
                </div>

                <div class="back">
                    <div class="form-header">
                        <h2>Create Account</h2>
                        <p>Join E-Learn and start coding today.</p>
                    </div>
                    
                    <form action="/api/register" method="POST" class="auth-form">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="name" placeholder="Full Name" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="auth-btn">Sign Up</button>
                    </form>
                    
                    <div class="form-footer">
                        <p>Already have an account? <span class="flip-link" onclick="toggleFlip()">Sign In here</span></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function toggleFlip() {
            const container = document.getElementById('flip-container');
            container.classList.toggle('flipped');
        }
    </script>
</body>
</html>
