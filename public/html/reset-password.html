<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - E-Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/auth.css">
    <style>
        .reset-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .reset-container h2 { color: #333; margin-bottom: 15px; }
        .reset-container p { color: #666; margin-bottom: 25px; font-size: 0.95em; }
        .message-box { padding: 10px; margin-bottom: 20px; border-radius: 5px; display: none; }
        .message-success { background: #e8f5e9; color: #2e7d32; display: block; }
        .message-error { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body class="auth-body">
    <div class="navbar" style="position: absolute; width: 100%; top: 0;"> 
        <img id="logo-img" src="/image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        <a href="../../index.html" style="margin-left: auto;" class="btn">Back to Home</a>
    </div>

    <div class="reset-container">
        <h2>Reset Your Password</h2>
        <p>Enter the 6-digit code sent to your email and your new password.</p>
        
        <div id="status-message" class="message-box"></div>

        <form id="reset-form" class="auth-form">
            <div class="input-group">
                <i class="fas fa-key icon-left" style="pointer-events: none;"></i>
                <input type="text" id="code" placeholder="6-Digit Reset Code" required maxlength="6" pattern="\d{6}">
            </div>
            <div class="input-group">
                <i class="fas fa-lock icon-left" style="pointer-events: none;"></i>
                <input type="password" id="password" placeholder="New Password" required minlength="6">
            </div>
            <div class="input-group">
                <i class="fas fa-lock icon-left" style="pointer-events: none;"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6">
            </div>
            <button type="submit" class="auth-btn">Reset Password</button>
        </form>
        
        <div style="margin-top: 20px; display: none;" id="login-link-container">
            <a href="auth.html" class="auth-btn" style="text-decoration: none; display: inline-block;">Go to Login</a>
        </div>
    </div>

    <script src="../javascript/config.js"></script>
    <script src="../javascript/reset-password.js"></script>
</body>
</html>
