<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - E-Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/auth.css">
    <style>
        .forgot-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .forgot-container h2 { color: #333; margin-bottom: 15px; }
        .forgot-container p { color: #666; margin-bottom: 25px; font-size: 0.95em; }
        .message-box { padding: 10px; margin-bottom: 20px; border-radius: 5px; display: none; }
        .message-success { background: #e8f5e9; color: #2e7d32; display: block; }
        .message-error { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body class="auth-body">
    <div class="navbar" style="position: absolute; width: 100%; top: 0;"> 
        <img id="logo-img" src="/image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        <a href="../../index.html" style="margin-left: auto;" class="btn">Back to Home</a>
    </div>

    <div class="forgot-container">
        <h2>Forgot Password?</h2>
        <p>Enter your email address and we'll send you a 6-digit code to reset your password.</p>
        
        <div id="status-message" class="message-box"></div>

        <form id="forgot-form" class="auth-form">
            <div class="input-group">
                <i class="fas fa-envelope icon-left"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <button type="submit" class="auth-btn">Send Reset Code</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="auth.html" style="color: #6C63FF; text-decoration: none;">Back to Login</a>
        </div>
    </div>

    <script src="../javascript/config.js"></script>
    <script src="../javascript/forgot-password.js"></script>
</body>
</html>
