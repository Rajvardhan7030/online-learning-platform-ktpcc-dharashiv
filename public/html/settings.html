<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - E-Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/settings.css">
    <script>
        if (!localStorage.getItem('ide_user')) {
            window.location.href = 'auth.html';
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar"> 
        <img id="logo-img" src="/image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        
        <a href="../../index.html">Home</a>
        <a href="tutorial.html">Tutorials</a>
        <a href="forum.html">Forum</a>
        <a href="#" onclick="openIDE(event)">Console</a>
        
        <div class="nav-auth-section" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            <div id="auth-buttons">
                <a href="auth.html" class="btn login-btn">Sign In</a>
            </div>

            <div id="profile-menu" class="nav-profile" style="display: none;">
                <div class="profile-btn" onclick="toggleDropdown()">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <strong id="display-name">Developer</strong>
                        <span id="display-email">student@university.edu</span>
                    </div>
                    <hr>
                    <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                    <a href="forum.html"><i class="fas fa-comments"></i> Forum</a>
                    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                    <hr>
                    <a href="#" onclick="logout()" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="settings-main">
        <header class="settings-header">
            <h1>Account Settings</h1>
            <p>Manage your profile and account preferences</p>
        </header>

        <div class="settings-container">
            
            <!-- Change Username Section -->
            <div class="setting-item" id="username-section">
                <button class="setting-btn" onclick="toggleSetting('username')">
                    <div class="btn-content">
                        <div class="btn-icon">
                            <i class="fas fa-user-edit"></i>
                        </div>
                        <div class="btn-text">
                            <h3>Change Username</h3>
                            <p>Update your display name</p>
                        </div>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </button>
                
                <div class="setting-form-container" id="username-form-container">
                    <form class="setting-form" id="username-form" onsubmit="updateUsername(event)">
                        <div class="form-group">
                            <label for="current-username">Current Username</label>
                            <input type="text" id="current-username" value="Developer" disabled>
                        </div>
                        <div class="form-group">
                            <label for="new-username">New Username</label>
                            <input type="text" id="new-username" placeholder="Enter new username" required>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" onclick="closeSetting('username')">Cancel</button>
                            <button type="submit" class="btn-save">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password Section -->
            <div class="setting-item" id="password-section">
                <button class="setting-btn" onclick="toggleSetting('password')">
                    <div class="btn-content">
                        <div class="btn-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="btn-text">
                            <h3>Change Password</h3>
                            <p>Update your account password</p>
                        </div>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </button>
                
                <div class="setting-form-container" id="password-form-container">
                    <form class="setting-form" id="password-form" onsubmit="updatePassword(event)">
                        <div class="form-group">
                            <label for="current-password">Current Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="current-password" placeholder="Enter current password" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('current-password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="new-password" placeholder="Enter new password" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('new-password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirm-password" placeholder="Confirm new password" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm-password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" onclick="closeSetting('password')">Cancel</button>
                            <button type="submit" class="btn-save">
                                <i class="fas fa-key"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Delete Account Section (Danger Zone) -->
            <div class="setting-item danger-item" id="delete-section">
                <button class="setting-btn danger-btn" onclick="toggleSetting('delete')">
                    <div class="btn-content">
                        <div class="btn-icon">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                        <div class="btn-text">
                            <h3>Delete Account</h3>
                            <p>Permanently remove your account and all data</p>
                        </div>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </button>
                
                <div class="setting-form-container" id="delete-form-container">
                    <div class="danger-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Warning: This action cannot be undone. All your progress, data, and settings will be permanently deleted.</span>
                    </div>
                    <form class="setting-form" id="delete-form" onsubmit="deleteAccount(event)">
                        <div class="form-group">
                            <label for="delete-password">Enter Password to Confirm</label>
                            <div class="input-wrapper">
                                <input type="password" id="delete-password" placeholder="Enter your password" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('delete-password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="confirm-delete" required>
                                <span class="checkmark"></span>
                                <span class="label-text">I understand that all my data will be permanently deleted</span>
                            </label>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" onclick="closeSetting('delete')">Cancel</button>
                            <button type="submit" class="btn-delete">
                                <i class="fas fa-trash"></i> Delete My Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
<script src="../javascript/config.js" ></script>
    <script src="../javascript/index.js"></script>
    <script src="../javascript/settings.js"></script>
</body>
</html>
