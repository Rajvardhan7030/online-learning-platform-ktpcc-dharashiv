<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learn Tutorials</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/home.css">
    
    <link rel="stylesheet" href="../css/tutorial.css">
</head>
<body>
    <div class="navbar"> 
        <img id="logo-img" src="../../image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        
        <a href="forum.html">Forum</a>
        <a href="#" onclick="openIDE(event)">Console</a>
        
        <div class="nav-auth-section" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            <!-- button for sign in and sign up -->
            <div id="auth-buttons">
                <a href="auth.html" class="btn login-btn" >Sign In</a>
            </div>

            <div id="profile-menu" class="nav-profile" style="display: none;">
                <div class="profile-btn" onclick="toggleDropdown()">
                    <i class="fas fa-user-circle"></i>
                </div>
                
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <strong id="display-name">Developer</strong>
                        <span id="display-email">student@university.edu</span>
                    </div>
                    <hr>
                    <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                    <a href="forum.html"><i class="fas fa-comments"></i> Forum</a>
                    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                    <hr>
                    <a href="#" onclick="logout()" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </div> <div class="dashboard-container" style="display: flex; height: calc(100vh - 60px);">
        
        <aside class="sidebar">
            <div class="language-controls">
                <div class="control-group">
                    <label for="prog-lang-select">Course:</label>
                    <select id="prog-lang-select" class="styled-select">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <!-- <option value="java">Java</option> -->
                        <option value="htmlcss">HTML & CSS</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="site-lang-select">Language:</label>
                    <select id="site-lang-select" class="styled-select">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <!-- <option value="mr">Marathi</option> -->
                    </select>
                </div>
            </div>

            <div class="sidebar-header" id="sidebar-header-text">
                Subtopics
            </div>
            <ul class="topic-list" id="topic-list">
                </ul>
        </aside>

        <main class="content-area" id="content-area" style="flex: 1; padding: 20px; overflow-y: auto;">
            <div class="placeholder-text">
                <i class="fas fa-hand-pointer" style="font-size: 3rem; margin-bottom: 1rem; color: #ccc;"></i><br>
                Please select a subtopic from the menu to start learning.
            </div>
        </main>

    </div>
<!-- this is the modal for video display -->
    <div id="videoModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeVideoModal()">&times;</span>
            <h3 id="modalTitle" style="color: var(--primary-color); margin-bottom: 15px;">Loading Video...</h3>
            <div class="video-container">
                <iframe id="youtubeFrame" width="100%" height="450" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- doc model for video modal -->

    <div id="docModal" class="modal" style="display: none;">
        <div class="modal-content doc-modal-content">
            <span class="close-btn" onclick="closeDocModal()">&times;</span>
            <h3 id="docModalTitle" style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Loading Document...</h3>
            <div id="docContent" class="doc-container">
                </div>
        </div>
    </div>
    <div id="podcastModal" class="modal" style="display: none;">
        <div class="modal-content podcast-modal-content">
            <span class="close-btn" onclick="closePodcastModal()">&times;</span>
            <h3 id="podcastModalTitle" style="color: var(--primary-color); margin-bottom: 15px; text-align: center;">Loading Podcast...</h3>
            
            <div class="audio-container" style="text-align: center; padding: 20px 0;">
                <i class="fas fa-podcast" style="font-size: 4rem; color: #0067f6; margin-bottom: 20px;"></i>
                <br>
                <audio id="audioPlayer" controls style="width: 100%; outline: none;">
                    <source src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </div>
    <!-- =================================================
                script
    =================================================  -->
    <script src="../javascript/config.js"></script>
    <script src="../javascript/index.js"></script>
    <script src="../javascript/tutorial.js"></script>
</body>
</html>
