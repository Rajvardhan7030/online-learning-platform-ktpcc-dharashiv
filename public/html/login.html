<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-learn</title>
    <style>
        .message { margin-top: 10px; font-weight: bold; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <form id="loginForm">
        <h2>Login</h2>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <pre>Don't have an account? <a href="/public/html/signup.html">Register</a></pre><br>
        
        <input type="submit" value="Login">

        <div id="statusMessage" class="message"></div>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Stop page refresh
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('statusMessage');

            statusDiv.textContent = "Logging in...";
            statusDiv.className = "message";

            try {
                // Send data to the Node.js login endpoint
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = "Success! Redirecting...";
                    statusDiv.className = "message success";
                    
                    // Save the user data and JWT token to localStorage
                    // This is the exact same key ('ide_user') the React IDE looks for!
                    localStorage.setItem('ide_user', JSON.stringify(data));
                    
                    // Redirect to dashboard after 1 second
                    setTimeout(() => {
                        window.location.href = '/public/html/dashboard.html'; // Or index.html
                    }, 1000);
                } else {
                    statusDiv.textContent = data.message || "Invalid credentials.";
                    statusDiv.className = "message error";
                }
            } catch (error) {
                statusDiv.textContent = "Error connecting to server. Is Node.js running?";
                statusDiv.className = "message error";
            }
        });
    </script>
</body>     
</html>
