<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/css/home.css">
</head>
<body> 
    <div class="navbar"> 
        <img id="logo-img" src="/image/logo.jpeg" alt="logo" onerror="this.src='https://via.placeholder.com/50'">
        <span id="logo-name1">E-</span><span id="logo-name2">learn</span>
        
        <a href="index.html">Home</a>
        <a href="/public/html/tutorial.html">Tutorial</a>
        <a href="#" onclick="openIDE(event)">Console</a>
        
        <div class="nav-auth-section" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            
          <div id="auth-buttons">
                <a href="/public/html/auth.html" class="btn login-btn">Sign In</a>
                <a href="/public/html/auth.html" class="btn signup-btn" style="background-color: var(--primary-color, #0067f6); color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none;">Sign Up</a>
            </div>

            <div id="profile-menu" class="nav-profile" style="display: none;">
                <div class="profile-btn" onclick="toggleDropdown()">
                    <i class="fas fa-user-circle"></i>
                </div>
                
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <strong id="display-name">Developer</strong>
                        <span id="display-email">student@university.edu</span>
                    </div>
                    <hr>
                    <a href="/public/html/dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                    <a href="#"><i class="fas fa-cog"></i> Settings</a>
                    <hr>
                    <a href="#" onclick="logout()" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function openIDE(event) {
            event.preventDefault(); 
            const userData = localStorage.getItem('ide_user');
            if (userData) {
                const encodedData = encodeURIComponent(userData);
                window.open(`http://localhost:3000/?auth=${encodedData}`, '_blank');
            } else {
                window.open('http://localhost:3000', '_blank');
            }
        }
    </script>
    
    <script src="/public/javascript/index.js"></script>
</body>
</html>
