services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: elearn_database
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  # Node.js Backend
  backend:
    build: ./backend
    container_name: elearn_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: on-failure

  # Main Landing Page / Platform Frontend
  frontend:
    build: .
    container_name: elearn_frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

  # React Code Compiler IDE
  ide_frontend:
    build: ./ide-frontend
    container_name: elearn_ide
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: