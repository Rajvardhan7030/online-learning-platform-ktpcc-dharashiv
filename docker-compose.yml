

services:
  # 1. Database: MongoDB
  mongo:
    image: mongo:latest
    container_name: mongodb_elearn
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - elearn-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API
  backend:
    build: ./backend
    container_name: backend_elearn
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/elearning-ide
      - JWT_SECRET=${JWT_SECRET:-mySuperSecretKey123}
      - FRONTEND_URL=http://localhost:5500
      - IDE_URL=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - elearn-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. React IDE Micro-Frontend
  ide:
    build: 
      context: ./ide-frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    container_name: ide_elearn
    ports:
      - "3000:3000"
    networks:
      - elearn-network
    restart: always
    depends_on:
      - backend

  # 4. Main Static Frontend
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.static-frontend
    container_name: main_frontend_elearn
    ports:
      - "5500:5500"
    networks:
      - elearn-network
    restart: always
    depends_on:
      - backend

networks:
  elearn-network:
    driver: bridge

volumes:
  mongo_data:
